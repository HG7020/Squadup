name: squadup
description: SquadUp - find gaming teammates, chat, join groups and read gaming news.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/squadup_logo_full.png
    - assets/logos/squadup_logo_full_dark.png
    - assets/logos/squadup_logo_icon.png
    - assets/logos/squadup_logo_icon_dark.png
    - assets/games/
